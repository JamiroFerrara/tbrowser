<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tbrowser</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #1b1b1b;
    color: #e2e2e2;
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    overflow-y: auto;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 24px 48px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #888; font-size: 12px; margin: 0 0 24px; }
  .card {
    border: 1px solid #303030;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: #202020;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .meta { color: #7d7d7d; font-size: 12px; word-break: break-all; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: inherit;
    font: inherit;
    font-size: 13px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover { border-color: #5a5a5a; }
  textarea {
    width: 100%;
    min-height: 320px;
    background: #141414;
    color: inherit;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    resize: vertical;
  }
  .status { font-size: 12px; color: #888; min-height: 18px; }
  .status.ok { color: #57b36b; }
  .status.err { color: #e06a6a; }
  @media (prefers-color-scheme: light) {
    body { background: #f7f7f7; color: #1e1e1e; }
    .card { background: #fff; border-color: #e0e0e0; }
    button { background: #fff; border-color: #ccc; }
    textarea { background: #fff; border-color: #ddd; }
  }
</style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div id="content"></div>
  </main>
  <script src="panel.js"></script>
</body>
</html>
