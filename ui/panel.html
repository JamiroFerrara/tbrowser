<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tbrowser</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #1b1b1b;
    color: #e2e2e2;
    font: 14px/1.5 "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, "Fira Code", "Cascadia Mono", Consolas, monospace;
    overflow-y: auto;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 24px 48px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #888; font-size: 12px; margin: 0 0 24px; }
  .card {
    border: 1px solid #303030;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: #202020;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .meta { color: #7d7d7d; font-size: 12px; word-break: break-all; }
  .ext { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
  .ext.off { opacity: 0.55; }
  .ext-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: #a0a0a0;
    overflow: hidden;
  }
  .ext-icon img { width: 100%; height: 100%; object-fit: contain; }
  .ext-version {
    font-size: 11px;
    font-weight: 400;
    color: #7d7d7d;
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
  }
  .ext-desc { font-size: 12.5px; color: #c0c0c0; margin: 6px 0; }
  .ext-perms { font-size: 11.5px; color: #7d7d7d; margin: 6px 0 2px; }
  .ext .row { margin: 10px 0 0; }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #9a9a9a;
    margin-right: 4px;
    cursor: pointer;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: inherit;
    font: inherit;
    font-size: 13px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover { border-color: #5a5a5a; }
  .group { margin-bottom: 26px; }
  .group > h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7d7d7d;
    margin: 0 0 10px;
  }
  .field { margin-bottom: 14px; }
  .field-label { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    background: #141414;
    color: inherit;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 9px;
    font: 12px/1.5 "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, "Fira Code", "Cascadia Mono", Consolas, monospace;
  }
  input[type="text"]:focus { outline: none; border-color: #5a7fbf; }
  input[type="checkbox"] { accent-color: #5a7fbf; width: 14px; height: 14px; }
  .kbd-row {
    display: grid;
    grid-template-columns: 180px 1fr auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 6px;
  }
  .kbd-label { font-size: 13px; color: #c8c8c8; }
  .hint { font-size: 12px; color: #7d7d7d; margin-top: 4px; }
  button.primary { background: #2f4f7f; border-color: #3f6aa8; }
  button.ghost { background: transparent; border-color: transparent; color: #888; padding: 4px 6px; }
  .status { font-size: 12px; color: #888; min-height: 18px; }
  .status.ok { color: #57b36b; }
  .status.err { color: #e06a6a; }
  @media (prefers-color-scheme: light) {
    body { background: #f7f7f7; color: #1e1e1e; }
    .card { background: #fff; border-color: #e0e0e0; }
    button { background: #fff; border-color: #ccc; }
    button.primary { background: #2f4f7f; border-color: #3f6aa8; color: #fff; }
    input[type="text"] { background: #fff; border-color: #ddd; }
    .kbd-label { color: #333; }
    .group > h2 { color: #8a8a8a; }
  }
</style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div id="content"></div>
  </main>
  <script src="panel.js"></script>
</body>
</html>
