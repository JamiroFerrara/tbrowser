<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tbrowser</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 var(--font);
    overflow-y: auto;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 24px 48px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 24px; }
  .card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: var(--bg-deep);
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .meta { color: var(--faint); font-size: 12px; word-break: break-all; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    background: var(--ctp-surface0);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    color: inherit;
    font: inherit;
    font-size: 13px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover { border-color: var(--ctp-surface2); background: var(--ctp-surface1); }
  .group { margin-bottom: 26px; }
  .group > h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 10px;
  }
  .field { margin-bottom: 14px; }
  .field-label { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    background: var(--bg-deeper);
    color: inherit;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 9px;
    font: 12px/1.5 var(--font);
    caret-color: var(--accent);
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }
  .kbd-row {
    display: grid;
    grid-template-columns: 180px 1fr auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 6px;
  }
  .kbd-label { font-size: 13px; color: var(--ctp-subtext1); }
  .hint { font-size: 12px; color: var(--faint); margin-top: 4px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover { background: var(--ctp-sapphire); border-color: var(--ctp-sapphire); }
  button.ghost { background: transparent; border-color: transparent; color: var(--faint); padding: 4px 6px; }
  button.ghost:hover { background: transparent; border-color: var(--line-strong); color: var(--fg); }
  .status { font-size: 12px; color: var(--muted); min-height: 18px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
</style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div id="content"></div>
  </main>
  <script src="panel.js"></script>
</body>
</html>
