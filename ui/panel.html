<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tbrowser</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: transparent;
    color: #e2e2e2;
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #shell { display: flex; height: 100%; }
  #nav {
    flex: 0 0 210px;
    width: 210px;
    padding: 30px 10px;
    border-right: 1px solid #2c2c2c;
    background: #1b1b1b;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #nav[hidden] { display: none; }
  #nav .nav-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6d6d6d;
    padding: 0 10px 8px;
  }
  #nav button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: #a4a4a4;
    padding: 6px 10px;
  }
  #nav button:hover { color: #e2e2e2; background: #262626; border-color: transparent; }
  #nav button.active { color: #fff; background: #2e2e2e; }
  #nav button:focus-visible { outline: 1px solid #5a7fbf; outline-offset: -1px; }
  main { flex: 1 1 auto; overflow-y: auto; padding: 32px 24px 48px; }
  .page { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #888; font-size: 12px; margin: 0 0 24px; }
  .card {
    border: 1px solid #303030;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: #202020;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .meta { color: #7d7d7d; font-size: 12px; word-break: break-all; }
  .ext { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
  .ext.off { opacity: 0.55; }
  .ext-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: #a0a0a0;
    overflow: hidden;
  }
  .ext-icon img { width: 100%; height: 100%; object-fit: contain; }
  .ext-version {
    font-size: 11px;
    font-weight: 400;
    color: #7d7d7d;
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
  }
  .ext-desc { font-size: 12.5px; color: #c0c0c0; margin: 6px 0; }
  .ext-perms { font-size: 11.5px; color: #7d7d7d; margin: 6px 0 2px; }
  .ext .row { margin: 10px 0 0; }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #9a9a9a;
    margin-right: 4px;
    cursor: pointer;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: inherit;
    font: inherit;
    font-size: 13px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover { border-color: #5a5a5a; }
  .group { margin-bottom: 26px; }
  .group > h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7d7d7d;
    margin: 0 0 10px;
  }
  .field { margin-bottom: 14px; }
  .field-label { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    background: #141414;
    color: inherit;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 9px;
    font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  input[type="text"]:focus { outline: none; border-color: #5a7fbf; }
  input[type="checkbox"] { accent-color: #5a7fbf; width: 14px; height: 14px; }
  .kbd-row {
    display: grid;
    grid-template-columns: 180px 1fr auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 6px;
  }
  .kbd-label { font-size: 13px; color: #c8c8c8; }
  .fav-row,
  .fav-new {
    display: grid;
    grid-template-columns: 16px minmax(110px, 1fr) minmax(170px, 1.6fr) auto;
    gap: 8px;
    align-items: center;
    padding: 4px 0;
  }
  .fav-row input[type="text"],
  .fav-new input[type="text"] { padding: 4px 7px; }
  .fav-remove { padding: 4px 6px; }
  .fav-new { margin-top: 10px; }
  .fav-gap { width: 16px; }
  .session-row {
    display: grid;
    grid-template-columns: minmax(120px, 1fr) auto auto auto auto auto auto;
    gap: 2px 4px;
    align-items: center;
    padding: 7px 0;
    border-top: 1px solid #2a2a2a;
  }
  .session-name { grid-area: 1 / 1; }
  .session-meta { grid-area: 2 / 1 / 3 / -1; font-size: 11.5px; color: #7d7d7d; }
  .session-up { grid-area: 1 / 2; }
  .session-down { grid-area: 1 / 3; }
  .session-open { grid-area: 1 / 4; }
  .session-rename { grid-area: 1 / 5; }
  .session-delete { grid-area: 1 / 6; }
  .session-new { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .session-new input { flex: 1 1 200px; }
  .hint { font-size: 12px; color: #7d7d7d; margin-top: 4px; }
  button.primary { background: #2f4f7f; border-color: #3f6aa8; }
  button.ghost { background: transparent; border-color: transparent; color: #888; padding: 4px 6px; }
  .status { font-size: 12px; color: #888; min-height: 18px; }
  .status.ok { color: #57b36b; }
  .status.err { color: #e06a6a; }
  @media (prefers-color-scheme: light) {
    body { color: #1e1e1e; }
    .card { background: #fff; border-color: #e0e0e0; }
    button { background: #fff; border-color: #ccc; }
    button.primary { background: #2f4f7f; border-color: #3f6aa8; color: #fff; }
    input[type="text"] { background: #fff; border-color: #ddd; }
    .kbd-label { color: #333; }
    .session-row { border-color: #e4e4e4; }
    .group > h2 { color: #8a8a8a; }
    #nav { background: #f4f4f4; border-color: #e0e0e0; }
    #nav button { color: #5a5a5a; }
    #nav button:hover { color: #1e1e1e; background: #e8e8e8; }
    #nav button.active { color: #111; background: #ddd; }
    #nav .nav-title { color: #8a8a8a; }
  }
  @media (max-width: 720px) {
    #shell { flex-direction: column; }
    #nav {
      flex: 0 0 auto;
      width: auto;
      flex-direction: row;
      padding: 10px 12px;
      border-right: 0;
      border-bottom: 1px solid #2c2c2c;
      overflow-x: auto;
      overflow-y: hidden;
    }
    #nav .nav-title { display: none; }
    #nav button { width: auto; white-space: nowrap; }
    main { padding: 22px 18px 40px; }
  }
</style>
</head>
<body>
  <div id="shell">
    <nav id="nav" hidden aria-label="Settings categories"></nav>
    <main>
      <div class="page">
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
        <div id="actions" class="row" hidden></div>
        <div id="status" class="status"></div>
        <div id="content"></div>
      </div>
    </main>
  </div>
  <script src="panel.js"></script>
</body>
</html>
