<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<style>
  /* The empty tab: one canvas and nothing else. It carries the same two colors
     as the chrome so a new tab is not the one white rectangle on the screen. */
  html { height: 100%; background: #1b1b1b; }
  body { margin: 0; height: 100%; }
  @media (prefers-color-scheme: light) {
    html { background: #f5f5f5; }
  }
</style>
</head>
<body></body>
</html>
