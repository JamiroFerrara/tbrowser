<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>New tab</title>
<style>
  /* The empty tab: the splash neovim shows on a bare buffer -- one Matrix quote
     picked at random, centered, nothing else. The colors are the splash's own,
     not the chrome's: catppuccin mocha's base with the blue nvim paints the
     dashboard header (SnacksDashboardHeader, which links to Title), and the
     latte pair when the system asks for light. Kept in this file so a rework of
     the browser's own theme cannot leave the new tab unpainted. */
  :root {
    color-scheme: dark light;
    --splash-bg: #1b1b1b;
    --splash-quote: #89b4fa;
    /* The editor's face at the terminal's size: 12pt, a terminal row tall. */
    --splash-font: "Fira Code", "JetBrainsMono Nerd Font", "JetBrains Mono",
      ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --splash-bg: #f5f5f5; --splash-quote: #1e66f5; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--splash-bg);
    color: var(--splash-quote);
    font: 400 12pt/1.35 var(--splash-font);
    /* The quote is the splash, not a paragraph: wrapping would break the lines
       the quotes were written to, and a line the window is too narrow for
       overhangs both edges the way it does past the editor's float. */
    white-space: pre;
    text-align: center;
    user-select: none;
  }
</style>
</head>
<body><div id="quote"></div>
<script>
  /* The dashboard's quote pool (lua/plugins/snacks_dashboard.lua): one of them
     per new tab, in the same order and with the same line breaks. */
  const QUOTES = [
    "wake up neo.",
    "Unfortunately, no one can be told what the Matrix is. \n You have to see it for yourself.",
    "Fate, it seems, is not without a sense of irony",
    "Guns, lots of guns",
    "I’m trying to free your mind, Neo. But I can only show you the door. \n You’re the one that has to walk through it",
    "I don’t like the idea that I’m not in control of my life",
    "What are you waiting for? \n You’re faster than this. Don’t think you are, know you are.",
    "If real is what you can feel, smell, taste and see, \n then ‘real’ is simply electrical signals interpreted by your brain",
    "Stop trying to hit me and hit me!",
    "I know Kung Fu.",
    "There is no spoon.",
    "You take the red pill, you stay in Wonderland, \n and I show you how deep the rabbit hole goes.",
    "Welcome to the real world.",
    "I can only show you the door. You’re the one who has to walk through it.",
    "Ignorance is bliss.",
    "The body cannot live without the mind.",
    "To deny our own impulses is to deny the very thing that makes us human.",
    "You have a problem with authority, Mr. Anderson.",
    "Not like this. Not like this.",
    "There is no escaping reason; no denying purpose.",
    "Neo, sooner or later you’re going to realize, \n just as I did, there’s a difference between knowing the path, \n and walking the path.",
    "Hope. It is the quintessential human delusion, \n simultaneously the source of your greatest strength and your greatest weakness.",
    "Choice is an illusion created between those with power and those without.",
    "What do men with power want? More power.",
    "I’m going to show them a world... \n where anything is possible.",
    "You hear that Mr. Anderson? That is the sound of inevitability.",
    "What if tomorrow the war could be over?",
    "The Matrix cannot tell you who you are.",
    "Every mammal on this planet instinctively develops a natural equilibrium with the surrounding environment.",
    "I know why you can’t sleep. I know what you’ve been doing.",
    "There is a difference between knowing the path and walking the path.",
    "It's unlike anything we've seen before.",
    "Never send a human to do a machine's job.",
    "Zion will fall.",
    "I'm trying to free your mind, Neo.",
    "What do all men with power want?",
    "Why, Mr. Anderson, why?",
    "The program Smith has grown beyond your control.",
    "What is 'real'? How do you define 'real'?",
    "I think we can handle one little girl.",
    "Denial is the most predictable of all human responses.",
    "I believe this night holds for each and every one of us, the very meaning of our lives.",
    "The Matrix is a world that has been pulled over your eyes.",
    "I want the same thing you want, Neo, and I am willing to go as far as you are.",
    "I have dreamed a dream, but now that my dream is over.",
    "As you can see, we've had our eye on you for some time now, Mr. Anderson.",
    "They’re watching you, Neo.",
    "It's the question that drives us, Neo."
  ];
  document.getElementById('quote').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  // A pooled view is handed from one new tab to the next, so the page must be
  // able to pick a fresh quote without being reloaded.
  window.rollQuote = () => {
    document.getElementById('quote').textContent =
      QUOTES[Math.floor(Math.random() * QUOTES.length)];
  };
</script>
</body>
</html>
