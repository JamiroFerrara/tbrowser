<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>New tab</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* The empty tab: the splash neovim shows on a bare buffer -- one Matrix quote
     picked at random, centered, nothing else. It reads the shared palette, so
     the page is the chrome's own surface (catppuccin base) and the quote is the
     blue nvim paints the dashboard header with (SnacksDashboardHeader, which
     links to Title). */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--accent);
    /* The editor's face at the terminal's size: 12pt, a terminal row tall. */
    font: 400 12pt/1.35 var(--font);
    /* The quote is the splash, not a paragraph: wrapping would break the lines
       the quotes were written to, and a line the window is too narrow for
       overhangs both edges the way it does past the editor's float. */
    white-space: pre;
    text-align: center;
    user-select: none;
  }
</style>
</head>
<body><div id="quote"></div>

</body>
</html>
