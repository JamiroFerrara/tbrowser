<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>command</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    background: #1b1b1b;
    color: #e6e6e6;
    border-top: 1px solid #333;
    font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  #prompt { color: #7a7a7a; font-weight: 600; }
  #q {
    flex: 1;
    min-width: 0;
    height: 30px;
    padding: 0 10px;
    background: #262626;
    color: inherit;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    font: inherit;
    outline: none;
  }
  #q:focus { border-color: #5b8def; }
  #hint { color: #6d6d6d; font-size: 12px; white-space: nowrap; }
  #hint.error { color: #e06a6a; }
  @media (prefers-color-scheme: light) {
    body { background: #f5f5f5; color: #1c1c1c; border-color: #ddd; }
    #q { background: #fff; border-color: #ccc; }
    #hint { color: #777; }
  }
</style>
</head>
<body>
  <span id="prompt">&gt;</span>
  <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search, address or :command">
  <span id="hint">Enter open · Esc close</span>
  <script src="bar.js"></script>
</body>
</html>
