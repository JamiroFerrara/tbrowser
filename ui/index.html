<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>command</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #1b1b1b;
    --fg: #e6e6e6;
    --muted: #7a7a7a;
    --line: #333;
    --field: #262626;
    --field-line: #3a3a3a;
    --accent: #5b8def;
    --pick: #2f2f2f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    border-top: 1px solid var(--line);
    font: 14px/1.4 "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, "Fira Code", "Cascadia Mono", Consolas, monospace;
  }
  #list {
    flex: 1;
    min-height: 0;
    margin: 0;
    padding: 4px 6px;
    overflow-y: auto;
    list-style: none;
    /* Inset shadow, not a border: the measured height is exactly rows + pad. */
    box-shadow: inset 0 -1px 0 var(--line);
    scrollbar-width: thin;
  }
  #list[hidden] { display: none; }
  #list li {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    cursor: default;
  }
  #list li .icon { flex: none; width: 18px; text-align: center; color: var(--muted); }
  #list li .title { overflow: hidden; text-overflow: ellipsis; }
  #list li .sub { margin-left: auto; padding-left: 12px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  #list li[aria-selected="true"] { background: var(--pick); }
  #list li[aria-selected="true"] .icon { color: var(--accent); }
  #row {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 43px;
    padding: 0 10px;
  }
  #prompt { color: var(--muted); font-weight: 600; }
  #q {
    flex: 1;
    min-width: 0;
    height: 30px;
    padding: 0 10px;
    background: var(--field);
    color: inherit;
    border: 1px solid var(--field-line);
    border-radius: 6px;
    font: inherit;
    outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #hint.error { color: #e06a6a; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f5f5; --fg: #1c1c1c; --muted: #777; --line: #ddd; --field: #fff; --field-line: #ccc; --pick: #e4e4e4; }
  }
</style>
</head>
<body>
  <ul id="list" role="listbox" hidden></ul>
  <div id="row">
    <span id="prompt">&gt;</span>
    <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search, address or :command">
    <span id="hint">Enter open · Esc close</span>
  </div>
  <script src="bar.js"></script>
</body>
</html>
