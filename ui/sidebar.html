<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tabs</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: transparent;
    color: #d9d9d9;
    border-right: 1px solid #2c2c2c;
    font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    color: #8a8a8a;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex: none;
  }
  header button {
    background: none;
    border: 1px solid #333;
    border-radius: 4px;
    color: inherit;
    font: inherit;
    padding: 0 6px;
    cursor: pointer;
  }
  header button:hover { border-color: #555; color: #fff; }
  #list { flex: 1; overflow-y: auto; padding: 0 4px 8px; }
  .window {
    padding: 10px 8px 4px;
    color: #777;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .window:first-child { padding-top: 2px; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: default;
    overflow: hidden;
  }
  .tab:hover { background: #232323; }
  .tab.active { background: #2b2b2b; color: #fff; }
  /* A buffer whose page is not in memory: it is an address waiting for a load,
     so it reads quieter than the pages that are still there. */
  .tab.unloaded { color: #777; }
  .tab.unloaded .title { font-style: italic; }
  .tab .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .close {
    flex: none;
    border: 0;
    background: none;
    color: #777;
    font: inherit;
    padding: 0 2px;
    cursor: pointer;
    visibility: hidden;
  }
  .tab:hover .close, .tab.active .close { visibility: visible; }
  .tab .close:hover { color: #fff; }
  footer { flex: none; padding: 6px 10px; color: #666; font-size: 11px; border-top: 1px solid #2c2c2c; }
  @media (prefers-color-scheme: light) {
    body { color: #222; border-color: #dcdcdc; }
    .tab:hover { background: #e7e7e7; }
    .tab.active { background: #dcdcdc; color: #000; }
    header, footer { color: #777; }
    .window { color: #777; }
    header button { border-color: #ccc; }
  }
</style>
</head>
<body>
  <header>
    <span>Tabs</span>
    <button id="new" title="New tab (Ctrl+T)">+</button>
  </header>
  <div id="list"></div>
  <footer>Ctrl+E hide</footer>
  <script src="sidebar.js"></script>
</body>
</html>
