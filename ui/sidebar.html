<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tabs</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg-deep);
    color: var(--fg);
    border-right: 1px solid var(--line);
    font: 13px/1.4 var(--font);
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    color: var(--faint);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex: none;
  }
  header button {
    background: none;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: inherit;
    font: inherit;
    padding: 0 6px;
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent); color: var(--accent); }
  #list { flex: 1; overflow-y: auto; padding: 0 4px 8px; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: default;
    overflow: hidden;
  }
  .tab:hover { background: var(--ctp-surface0); }
  .tab.active { background: var(--ctp-surface1); color: var(--fg); }
  .tab.active .title { font-weight: 600; }
  .tab .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .close {
    flex: none;
    border: 0;
    background: none;
    color: var(--faint);
    font: inherit;
    padding: 0 2px;
    cursor: pointer;
    visibility: hidden;
  }
  .tab:hover .close, .tab.active .close { visibility: visible; }
  .tab .close:hover { color: var(--danger); }
  footer { flex: none; padding: 6px 10px; color: var(--ctp-overlay0); font-size: 11px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <header>
    <span>Tabs</span>
    <button id="new" title="New tab (Ctrl+T)">+</button>
  </header>
  <div id="list"></div>
  <footer>Ctrl+E hide</footer>
  <script src="sidebar.js"></script>
</body>
</html>
